<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>co 프로필 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap">
<style>
  /* Layout: 검은 점무늬 배경 위 중앙에 흰 카드 한 장 */
  :root {
    --bg: #000000;
    --card: #ffffff;
    --ink: #000000;
    --muted: #9a9a9a;
    --dot: rgba(127, 127, 127, 0.3);
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
  }
  .card {
    box-sizing: border-box;
    width: min(480px, 100%);
    background: var(--card);
    padding: 40px 36px 36px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card > * { min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .title { font-size: 22px; font-weight: 700; line-height: 1.3; margin: 0 0 2px; letter-spacing: 0.01em; }
  .line, .block { font-size: 12px; line-height: 1.35; margin: 0; letter-spacing: -0.03em; }
  .muted { color: var(--muted); }
  .credit { font-size: 12px; color: var(--muted); margin: 12px 0 0; letter-spacing: 0.02em; }
  @media (max-width: 560px) { .card { padding: 32px 24px 28px; } }
</style>

<main class="card">
  <h1 class="title">@林燦熙</h1>
  <p class="line">¹天使 · 성인 · ONLY</p>
  <p class="line">@kit 임찬희 · @smoke_nonsmoker 건전한닉네임28 · @hearts 한야</p>
  <p class="line muted">→ 임찬희 제외 배려 필요 X</p>
  <p class="block">NG 드림 지우기 · 발콕콕(수동공격) · 제작자 까풀
겹드림 X 기능 사용</p>
  <p class="credit">@noxmeluv</p>
</main>

</body></html>
